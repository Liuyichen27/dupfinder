[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dupfinder"
version = "1.0.0"
description = "找出内容完全相同的文件，只出报告不删文件"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Liuyichen27" }]
keywords = ["duplicate", "files", "hash", "disk", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Liuyichen27/dupfinder"

[project.scripts]
dupfinder = "dupfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
